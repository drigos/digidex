<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- GitHub Pages serves this page at any missing path, so relative URLs resolve from the site root -->
<base href="https://digidex.martins.icu/" />
<link rel="icon" href="favicon.ico" sizes="32x32" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<title>Page not found: Digidex</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#06111f" />
<link rel="stylesheet" href="digivolution.css" />
<style>
  /* not-found page (self-contained like the landing page; reuses the shared tokens from digivolution.css) */
  /* the content is short: fill the viewport so the page gradient does not tile below it */
  html { min-height: 100%; }
  .wrap { padding: 48px 22px 56px; max-width: 1400px; margin: 0 auto; overflow: visible; }

  .hero { text-align: center; margin: 18px auto 0; max-width: 860px; }
  .hero .kicker {
    display: inline-block; margin-bottom: 14px; padding: 6px 16px; border-radius: 999px;
    font-size: 12.5px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase;
    color: #cfe6ff; background: rgba(88,166,255,.14); border: 1px solid rgba(88,166,255,.34);
  }
  .hero h1 {
    font-size: 60px; line-height: 1.03; letter-spacing: -1.8px; margin: 0 0 14px;
    background: linear-gradient(180deg, #ffffff, #a9c7ee);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hero p { color: var(--muted); font-size: 17px; line-height: 1.5; margin: 0 0 28px; }
  @media (max-width: 820px) { .hero h1 { font-size: 42px; } }
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <span class="kicker">Error 404</span>
    <h1>Page not found</h1>
    <p>There is no page at this address. The home page lists every section of the Digidex.</p>
    <a class="backnav" href="index.html"><span class="arrow">&#8592;</span> Home</a>
  </header>

</div>
</body>
</html>
