<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- same radial gradient as the page background in digivolution.css -->
    <radialGradient id="page" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="2400">
      <stop offset="0" stop-color="#1e4979"/>
      <stop offset=".3" stop-color="#102b4c"/>
      <stop offset=".72" stop-color="#06111f"/>
    </radialGradient>
    <!-- the favicon.svg tile and glyph gradients -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17406e"/>
      <stop offset="1" stop-color="#06111f"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd43b"/>
      <stop offset="1" stop-color="#f5a524"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#page)"/>
  <!-- favicon.svg scaled to 180px, with the border of the site's pills -->
  <g transform="translate(510 105) scale(2.8125)">
    <rect width="64" height="64" rx="14" fill="url(#bg)" stroke="#ffffff" stroke-opacity=".16" stroke-width=".4"/>
    <path fill="url(#glyph)" fill-rule="evenodd" d="M15 12h15a20 20 0 0 1 0 40H15zM24 21v22h6a11 11 0 0 0 0-22z"/>
  </g>
  <text x="600" y="435" text-anchor="middle" font-family="'Noto Sans', sans-serif" font-weight="900" font-size="112" fill="#eef7ff">Digidex</text>
  <text x="600" y="517" text-anchor="middle" font-family="'Noto Sans', sans-serif" font-weight="700" font-size="40" fill="#a9bed8">Evolution trees, cosmology &amp; group rosters</text>
</svg>
